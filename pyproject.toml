[project]
name = "iconic-scenes"
version = "0.1.1"
description = "Find a famous movie line in the Plex subtitles, then keep the best still of the scene. No LLM."
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pysubs2>=1.9.0",
    "rapidfuzz>=3.9",
]

[project.scripts]
iconic-scenes = "iconic_scenes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iconic_scenes"]
